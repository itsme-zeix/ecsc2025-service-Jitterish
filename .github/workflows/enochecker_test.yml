name: enochecker_test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: arc-runner-dink
    env:
      ENOCHECKER_TEST_CHECKER_PORT: 8400
    steps:
    - uses: attacking-lab/actions/.github/actions/github-credentials-store@main
      with:
        password: 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
    - uses: actions/checkout@v2
      with:
        submodules: recursive
    - name: Set up Python 3.13
      uses: actions/setup-python@v2
      with:
        python-version: 3.13
    - name: Install enochecker_test
      run: |
        python -m pip install --upgrade pip
        pip install git+https://github.com/attacking-lab/enochecker-core@v0.13.0
        pip install git+https://github.com/attacking-lab/enochecker-test@v0.13.0

    - name: Cleanup source (meta scripts)
      run: |
        cd service
        docker compose -f ../meta/docker-compose.override.yml --project-directory . run --rm cleanup-source
    - name: start service
      run: |
        cd service
        docker compose up --build --force-recreate -d
    - name: start checker
      run: |
        cd checker
        echo "GITHUB_PAT=${{ secrets.CI_PAT }}" >> .env
        docker compose up --build --force-recreate -d
    - name: obtain Docker host IP
      run: |
        docker network ls
        echo "ENOCHECKER_TEST_SERVICE_ADDRESS=$(docker network inspect jitterish_default | jq -r '.[].IPAM.Config[].Gateway')" | tee -a $GITHUB_ENV
        echo "ENOCHECKER_TEST_CHECKER_ADDRESS=$(docker network inspect jitterish_checker | jq -r '.[].IPAM.Config[].Gateway')" | tee -a $GITHUB_ENV
    - name: run enochecker_test
      run: |
        enochecker_test
    - name: Dump docker logs on failure
      if: failure()
      uses: jwalton/gh-docker-logs@v1
      with:
        dest: './logs'
    - name: Tar logs
      if: failure()
      run: tar cvzf ./logs.tgz ./logs
    - name: Upload logs to GitHub
      if: failure()
      uses: actions/upload-artifact@master
      with:
        name: logs.tgz
        path: ./logs.tgz
    - name: Kill docker containers
      if: failure() || success()
      run: |
        (cd service && docker compose down -v)
        (cd checker && docker compose down -v)
