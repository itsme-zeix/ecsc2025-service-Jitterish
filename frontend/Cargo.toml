[package]
name = "frontend"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
interface = { version = "0.1.0", path = "../interface" }
serde = "1.0.219"
serde_json = { version = "1.0.140", features = ["raw_value"] }
hex = "0.4.3"
sha2 = "0.10.8"
uuid = {version = "1.16.0", features = ["v4"]}

[dependencies.rocket]
version = "0.5.1"
features = ["secrets", "json"]

[dependencies.rocket_dyn_templates]
# path = "../../contrib/dyn_templates"
version = "0.2.0"
features = ["handlebars"]
